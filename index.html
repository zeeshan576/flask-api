<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>House Price Predictor</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
            background: #f4f4f4;
        }

        .box {
            background: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: darkgreen;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            color: blue;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>🏠 House Price Predictor</h2>

    <p>Click button to get prediction</p>

    <button onclick="predict()">Predict Price</button>

    <h3 id="result"></h3>
</div>

<script>
async function predict() {

    const response = await fetch("https://flask-api-production.up.railway.app/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            features: [8.3252,41.0,6.9841,1.0238,322.0,2.5556,37.88,-122.23]
        })
    });

    const data = await response.json();

    document.getElementById("result").innerText =
        "Predicted Price: " + data.prediction;
}
</script>

</body>
</html>
